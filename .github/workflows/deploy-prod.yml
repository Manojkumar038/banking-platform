name: Deploy to PROD

on:
  push:
    branches: [promotion/prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: PROD promotion pipeline (metadata-only)
    if: github.ref == 'refs/heads/promotion/prod' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: PROD
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate engineering dataset
        run: python engineering-data/load_dataset.py
      - name: Record PROD workflow manifest
        run: |
          mkdir -p dist
          python - <<'PY'
          import json, os
          data = {
              "environment": "PROD",
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "application_runtime_deployed": False,
              "deployment_mode": "metadata-only",
              "runtime_target": None
          }
          with open("dist/prod-manifest.json", "w") as f:
              json.dump(data, f, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prod-manifest-${{ github.run_id }}
          path: dist/prod-manifest.json
