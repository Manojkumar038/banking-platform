name: Deploy to DEV
run-name: "Deployment triggered to DEV | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    branches: [main, promotion/dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deployment triggered to DEV (validation-only)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/promotion/dev'
    runs-on: ubuntu-latest
    environment:
      name: DEV
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout source for DEV
        uses: actions/checkout@v4

      - name: Set up Python validation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Announce DEV deployment trigger
        run: |
          echo "Deployment triggered to DEV"
          echo "Source branch: $GITHUB_REF_NAME"
          echo "Source commit: $GITHUB_SHA"
          echo "This is a metadata-only pipeline; no application runtime is deployed."

      - name: Validate synthetic engineering dataset for DEV
        run: python engineering-data/load_dataset.py

      - name: Create DEV deployment execution manifest
        env:
          TARGET_ENVIRONMENT: DEV
        run: |
          mkdir -p dist
          python - <<'PY'
          import json, os
          manifest = {
              "environment": os.environ["TARGET_ENVIRONMENT"],
              "deployment_trigger": "Deployment triggered to DEV",
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "deployment_mode": "github-environment-record-only",
              "application_runtime_deployed": False,
              "runtime_target": None,
              "note": "No hosting or AWS EKS target is configured. This run validates fixtures and records GitHub DEV environment activity only."
          }
          with open("dist/deployment-manifest.json", "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
          PY

      - name: Upload DEV deployment execution record
        uses: actions/upload-artifact@v4
        with:
          name: dev-deployment-manifest-${{ github.run_id }}
          path: dist/deployment-manifest.json
          if-no-files-found: error
