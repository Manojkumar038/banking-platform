name: Deploy to TEST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: TEST deployment pipeline (manual, metadata-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: TEST
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository engineering fixtures
        run: python engineering-data/load_dataset.py

      - name: Create deployment manifest
        env:
          TARGET_ENVIRONMENT: TEST
        run: |
          mkdir -p dist
          python - <<'PY'
          import json, os
          manifest = {
              "environment": os.environ["TARGET_ENVIRONMENT"],
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "deployment_mode": "github-environment-record-only",
              "application_runtime_deployed": False,
              "runtime_target": None,
              "note": "No hosting or AWS EKS target is configured yet. This run validates fixtures and records the GitHub Environment workflow execution only."
          }
          with open("dist/deployment-manifest.json", "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
          PY

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: test-deployment-manifest-${{ github.run_id }}
          path: dist/deployment-manifest.json
          if-no-files-found: error
