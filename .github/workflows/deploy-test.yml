name: Deploy to TEST
run-name: "Deployment triggered to TEST | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    branches: [promotion/test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Deployment triggered to TEST (validation-only)
    if: github.ref == 'refs/heads/promotion/test' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: TEST
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout source for TEST
        uses: actions/checkout@v4

      - name: Set up Python validation runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Announce TEST deployment trigger
        run: |
          echo "Deployment triggered to TEST"
          echo "Source branch: $GITHUB_REF_NAME"
          echo "Source commit: $GITHUB_SHA"
          echo "This is a metadata-only pipeline; no application runtime is deployed."

      - name: Validate synthetic engineering dataset for TEST
        run: python engineering-data/load_dataset.py

      - name: Create TEST deployment execution manifest
        run: |
          mkdir -p dist
          python - <<'PY'
          import json, os
          manifest = {
              "environment": "TEST",
              "deployment_trigger": "Deployment triggered to TEST",
              "source_ref": os.environ["GITHUB_REF"],
              "source_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "deployment_mode": "github-environment-record-only",
              "application_runtime_deployed": False,
              "runtime_target": None,
              "note": "No application hosting or AWS EKS target is configured. This run validates fixtures and records GitHub TEST environment activity only."
          }
          with open("dist/test-manifest.json", "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2)
          PY

      - name: Upload TEST deployment execution record
        uses: actions/upload-artifact@v4
        with:
          name: test-deployment-manifest-${{ github.run_id }}
          path: dist/test-manifest.json
          if-no-files-found: error
