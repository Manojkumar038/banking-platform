name: Validate repository fixtures

on:
  push:
    branches: [main, "feature/**", "story/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository structure
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/metric-definitions.md
          test -s docs/data-provenance.md
          test -s database/schema.sql

      - name: Validate synthetic engineering dataset
        run: python engineering-data/load_dataset.py
